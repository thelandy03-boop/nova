[workspace]
resolver = "2"
members = [
    "crates/prowave-app",
    "crates/prowave-engine",
    "crates/prowave-sfz",
    "crates/prowave-exs",
    "crates/prowave-garageband-import",
    "crates/prowave-guitarpro",
    "crates/prowave-hydrogen-import",
    "crates/prowave-ladspa",
    "crates/prowave-logicx-import",
    "crates/prowave-musicxml",
    "crates/prowave-project",
    "crates/nova-dsp",
    "crates/nova-vst3-host",
    "crates/nova-clap-host",
    "crates/prowave-android",
    "crates/prowave-stretch",
    "xtask",
]
default-members = [
    "crates/prowave-app",
    "crates/prowave-engine",
    "crates/prowave-sfz",
    "crates/prowave-exs",
    "crates/prowave-garageband-import",
    "crates/prowave-guitarpro",
    "crates/prowave-hydrogen-import",
    "crates/prowave-ladspa",
    "crates/prowave-logicx-import",
    "crates/prowave-musicxml",
    "crates/prowave-project",
    "crates/nova-dsp",
    "crates/nova-vst3-host",
    "crates/nova-clap-host",
    "crates/prowave-stretch",
    "xtask",
]

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
opt-level = 3
