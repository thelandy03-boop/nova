[package]
name = "nova-vst3-host"
description = "Nova VST3 plugin host: scans, loads and runs third-party VST3 plugins behind the safe nova-dsp Plugin trait"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
nova-dsp = { path = "../nova-dsp" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vst3 = "0.3"
libloading = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSGraphics"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
