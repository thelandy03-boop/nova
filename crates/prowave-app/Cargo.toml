[package]
name = "prowave-app"
version = "0.3.0"
edition = "2021"
description = "Pro Wave desktop app (egui) - clean-room DAW UI inspired by Logic Pro"
license = "GPL-3.0-or-later"

[[bin]]
name = "prowave"
path = "src/main.rs"

[lib]
name = "prowave_app"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
default = ["x11", "accessibility"]
x11 = ["eframe/x11", "winit/x11"]
accessibility = ["eframe/accesskit"]
android = ["eframe/android-native-activity", "winit/android-native-activity"]

[dependencies]
assert_no_alloc = "1.1.2"
# The defaults are listed one by one so that `x11` can stay optional: an eframe default build
# always pulls winit's X11 backend.
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "web_screen_reader",
    "wgpu",
] }
# eframe re-exports winit's types but not its features. `rwh_06` and the Wayland features are
# what winit's own defaults give on Linux; `x11` is added by this crate's default feature.
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
] }
egui = "0.37"
human-panic = "2.0.8"
prowave-engine = { version = "0.1.0", path = "../prowave-engine" }
prowave-garageband-import = { version = "0.1.0", path = "../prowave-garageband-import" }
prowave-guitarpro = { version = "0.1.0", path = "../prowave-guitarpro" }
prowave-hydrogen-import = { version = "0.1.0", path = "../prowave-hydrogen-import" }
prowave-ladspa = { version = "0.1.0", path = "../prowave-ladspa" }
prowave-logicx-import = { version = "0.1.0", path = "../prowave-logicx-import" }
prowave-musicxml = { version = "0.1.0", path = "../prowave-musicxml" }
prowave-mxl = { version = "0.1.0", path = "../prowave-mxl" }
prowave-plugin-host = { version = "0.1.0", path = "../prowave-plugin-host" }
prowave-rex = { version = "0.1.0", path = "../prowave-rex" }
prowave-project = { version = "0.1.0", path = "../prowave-project" }
prowave-sfz = { version = "0.1.0", path = "../prowave-sfz" }
prowave-exs = { version = "0.1.0", path = "../prowave-exs" }
prowave-vamp = { version = "0.1.0", path = "../prowave-vamp" }
nova-vst3-host = { version = "0.1.0", path = "../nova-vst3-host" }
nova-clap-host = { version = "0.1.0", path = "../nova-clap-host" }
nova-dsp = { version = "0.1.0", path = "../nova-dsp" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rtrb = "0.4.0"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
sha2 = "0.10"
serde_json = "1.0.154"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rhai = { version = "1", features = ["no_module"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
midir = "0.11.1"
rfd = "0.17.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

# The menus in the macOS system menu bar (see src/native_menu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.21.0", default-features = false }
# `--screenshot` must not take the focus on macOS (see `event_loop_builder` in main.rs);
# eframe re-exports winit's types but not the `platform::macos` extension trait.
winit = "0.30.13"

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"
