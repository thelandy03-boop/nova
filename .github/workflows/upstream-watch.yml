name: Upstream Watcher

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite dispararlo manualmente en cualquier momento

permissions:
  contents: write
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Comprobar actualizaciones en SoundCraft y Pro-Wave
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          STATE_FILE=".upstream-state.json"
          if [ ! -f "$STATE_FILE" ]; then
            echo '{"soundcraft":"","prowave":""}' > "$STATE_FILE"
          fi

          LAST_SC=$(jq -r '.soundcraft // ""' "$STATE_FILE")
          LAST_PW=$(jq -r '.prowave // ""' "$STATE_FILE")

          LATEST_SC=$(gh api repos/storytold/soundcraft/commits/main --jq '.sha' || echo "$LAST_SC")
          LATEST_PW=$(gh api repos/fabox-os/Pro-Wave/commits/main --jq '.sha' || echo "$LAST_PW")

          CHANGES_FOUND=false
          BODY="## 🔔 Nuevas actualizaciones detectadas en Upstream\n\n"

          if [ "$LAST_SC" != "$LATEST_SC" ]; then
            CHANGES_FOUND=true
            SC_MSG=$(gh api "repos/storytold/soundcraft/commits/$LATEST_SC" --jq '.commit.message' | head -n 3)
            SC_AUTHOR=$(gh api "repos/storytold/soundcraft/commits/$LATEST_SC" --jq '.commit.author.name')
            BODY="${BODY}### 🎛️ SoundCraft (Pro Tools Engine & DSP)\n- **Último Commit**: [\`$LATEST_SC\`](https://github.com/storytold/soundcraft/commit/$LATEST_SC)\n- **Autor**: $SC_AUTHOR\n- **Mensaje**:\n> $SC_MSG\n\n"
          fi

          if [ "$LAST_PW" != "$LATEST_PW" ]; then
            CHANGES_FOUND=true
            PW_MSG=$(gh api "repos/fabox-os/Pro-Wave/commits/$LATEST_PW" --jq '.commit.message' | head -n 3)
            PW_AUTHOR=$(gh api "repos/fabox-os/Pro-Wave/commits/$LATEST_PW" --jq '.commit.author.name')
            BODY="${BODY}### 🎹 Pro-Wave (Logic Pro UI)\n- **Último Commit**: [\`$LATEST_PW\`](https://github.com/fabox-os/Pro-Wave/commit/$LATEST_PW)\n- **Autor**: $PW_AUTHOR\n- **Mensaje**:\n> $PW_MSG\n\n"
          fi

          if [ "$CHANGES_FOUND" = true ]; then
            echo "Nuevos cambios detectados. Creando Issue de notificación..."
            echo -e "$BODY" > /tmp/issue_body.md
            gh issue create --title "🔔 Actualizaciones disponibles en repositorios upstream" --body-file /tmp/issue_body.md

            # Actualizar estado local
            jq --arg sc "$LATEST_SC" --arg pw "$LATEST_PW" '.soundcraft = $sc | .prowave = $pw' "$STATE_FILE" > /tmp/state.json
            mv /tmp/state.json "$STATE_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$STATE_FILE"
            git commit -m "chore(upstream): actualizar SHAs de seguimiento" || true
            git push || true
          else
            echo "Sin cambios en los repositorios upstream."
          fi
